name: One-time PR8 Lock Adoption

on:
  push:
    branches: ["chore/pr-review-fallback-gate"]
    paths:
      - ".github/workflows/adopt-pr8-lock.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR #11 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/pr-review-fallback-gate
          fetch-depth: 0

      - name: Adopt exact verified PR #8 lockfile
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_BRANCH="chore/factory-organisation"
          CANONICAL_HEAD="73f4d4fef909242e49576133a8a321e8f4e22683"
          EXPECTED_PACKAGE_BLOB="a743ed1012accc0c8cafb3b49893cc61d53bccf8"
          EXPECTED_LOCK_BLOB="b74ea283fdffd4c8d4a6d329ceffc9e09611228e"

          test "$(git hash-object package.json)" = "$EXPECTED_PACKAGE_BLOB"
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CANONICAL_HEAD"
          git show "$CANONICAL_HEAD:package-lock.json" > package-lock.json
          test "$(git hash-object package-lock.json)" = "$EXPECTED_LOCK_BLOB"

      - name: Verify adopted dependency state
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install and security proof
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Commit adopted lock and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/adopt-pr8-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/adopt-pr8-lock.yml
          git commit -m "fix(deps): adopt verified PR #8 lockfile"
          git push origin HEAD:chore/pr-review-fallback-gate
