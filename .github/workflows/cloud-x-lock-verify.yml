name: Cloud X Lock Verify

on:
  push:
    branches:
      - chore/cloud-x-lock-generator
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/cloud-x-lock-generator

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact Cloud X frontend lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object factory/generated/cloud-x-lock/package-lock.json)" = "f40128e7bfad7bdbb883f6ba0a7bde9b67d9a87c"
          rm -rf .factory-tmp/cloud-x-frontend-verify
          mkdir -p .factory-tmp/cloud-x-frontend-verify
          cat > .factory-tmp/cloud-x-frontend-verify/package.json <<'JSON'
          {
            "name": "streamvista-cloud-x-frontend",
            "private": true,
            "version": "0.1.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc -b && vite build"
            },
            "dependencies": {
              "@supabase/supabase-js": "^2.55.0",
              "react": "19.1.1",
              "react-dom": "19.1.1"
            },
            "devDependencies": {
              "@types/react": "19.1.10",
              "@types/react-dom": "19.1.7",
              "@vitejs/plugin-react": "4.7.0",
              "typescript": "5.8.3",
              "vite": "7.3.6"
            }
          }
          JSON
          cp factory/generated/cloud-x-lock/package-lock.json .factory-tmp/cloud-x-frontend-verify/package-lock.json
          cd .factory-tmp/cloud-x-frontend-verify
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
