name: Factory Quality Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main, "chore/factory-organisation"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Build / npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Semgrep scan
        run: semgrep scan --config auto --error --metrics=off

  osv:
    name: OSV Dependency Scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      scan-args: |-
        --recursive
        ./
