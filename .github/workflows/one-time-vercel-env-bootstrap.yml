name: One-time Vercel env bootstrap

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - tools/one-time-vercel-bootstrap/**
      - .github/workflows/one-time-vercel-env-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: streamvista-one-time-vercel-env-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/one-time-vercel-env-bootstrap-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require existing Vercel authorization
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is unavailable. No Vercel mutation was attempted."
            exit 1
          fi

      - name: Run fail-closed one-time bootstrap
        run: node tools/one-time-vercel-bootstrap/server.mjs --direct
