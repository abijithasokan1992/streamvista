name: PR8 Dependency Lock Repair

on:
  push:
    branches:
      - chore/factory-organisation

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: chore/factory-organisation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Repair vulnerable lock entries
        run: npm audit fix --package-lock-only

      - name: Verify repaired lock installs
        run: npm ci

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Commit repaired lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): repair audited lockfile vulnerabilities"
          git push origin HEAD:chore/factory-organisation
