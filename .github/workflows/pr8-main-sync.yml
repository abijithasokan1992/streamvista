name: PR8 Safe Main Sync

on:
  push:
    branches:
      - chore/factory-organisation

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with history
        uses: actions/checkout@v4
        with:
          ref: chore/factory-organisation
          fetch-depth: 0

      - name: Merge current main safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff origin/main -m "chore: sync main into PR #8"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^factory/products/REGISTRY.md$' || true)"

            if [ -n "$unexpected" ] || [ -z "$conflicts" ]; then
              echo "Unexpected merge conflict(s):"
              printf '%s\n' "$conflicts"
              git merge --abort || true
              exit 1
            fi

            # REGISTRY.md on this branch already reconciles the latest verified
            # Core 5 main evidence with the richer canonical/UNVERIFIED records.
            git checkout --ours factory/products/REGISTRY.md
            git add factory/products/REGISTRY.md
            git commit --no-edit
          fi

          if git diff --quiet origin/chore/factory-organisation..HEAD; then
            echo "Branch already synchronized"
            exit 0
          fi

          git push origin HEAD:chore/factory-organisation
