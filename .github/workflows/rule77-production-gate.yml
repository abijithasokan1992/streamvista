name: Rule 77 Production AI OS Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [rule77/production-rbac-security]

permissions:
  contents: read

concurrency:
  group: rule77-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run verify:rule77
      - run: npm audit --audit-level=high
      - run: npm run build
