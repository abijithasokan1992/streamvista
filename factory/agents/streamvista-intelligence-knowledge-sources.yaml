version: 1
owner: StreamVista FACTORY
purpose: >-
  Register approved knowledge-source bindings for the StreamVista Intelligence Agent
  without copying confidential source material into this public repository.

public_repository_policy:
  raw_confidential_content: forbidden
  secrets: forbidden
  api_keys: forbidden
  credentials: forbidden
  private_customer_or_catalogue_data: forbidden
  allowed: source identifiers, classifications, derived operating rules, and non-sensitive schemas

sources:
  - id: creator_acquisition_growth_system_2026
    name: StreamVista Creator Acquisition Growth System — Production Research Report
    classification: internal_confidential_research
    canonical_storage: private_library
    raw_content_in_public_repo: false
    ingestion_mode: derived_rules_only
    authority_scope:
      - creator_acquisition
      - homepage_conversion
      - creator_onboarding
      - upload_reliability
      - rights_readiness
      - buyer_readiness
      - lifecycle_growth
      - funnel_analytics
    derived_rules:
      - creator_acquisition_is_the_primary_supply_side_growth_motion
      - one_title_maps_to_one_persistent_draft
      - retries_resume_existing_state_and_must_not_fork_duplicate_titles
      - uploads_must_be_resumable_recoverable_and_preflight_validated
      - rights_must_be_structured_queryable_and_evidence_linked
      - rights_verified_and_buyer_ready_states_require_verification_evidence
      - ai_assists_after_creator_intent_and_must_not_invent_rights_or_legal_clearance
      - generic_analytics_must_not_contain_rights_document_contents_or_unnecessary_pii
      - funnel_instrumentation_is_required_from_launch
      - north_star_is_new_rights_verified_buyer_ready_titles_per_week
      - creator_lifecycle_outreach_stops_or_changes_after_activation
      - buyer_facing_readiness_states_are_reserved_for_verified_buyer_ready_titles
    routing:
      product: Creator Cloud
      marketplace: Crayons Bridge
      agents:
        - StreamVista Intelligence Agent
        - Creator AI
        - Rights Agent
        - Metadata Agent
        - QC Agent
        - Buyer Matching
        - Growth Agent
        - CRM Agent
      command_centers:
        - Founder / AI Command Center
    evidence_policy:
      preserve_private_source_reference: true
      quote_or_export_raw_source_publicly: false
      derived_claims_require_traceability: true
      legal_or_rights_status_requires_human_or_defined_verification_gate: true
